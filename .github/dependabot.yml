# Dependabot opens pull requests for dependency updates; the CI workflows test each one.
# @types/node majors are ignored everywhere: the types should match the oldest Node a project
# supports ("engines"), and move only when that does.
version: 2
updates:
  - package-ecosystem: npm
    directory: /vention/snack1-robot-arm
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "snack1"
    groups:
      # @types/three is versioned to match three, so they always move together.
      # Below 1.0.0 a minor bump (0.170 → 0.171) can break, which is why CI must pass first.
      three:
        patterns: ["three", "@types/three"]
      # Minor and patch updates to the build and test tools come as one pull request.
      # Major updates (e.g. Vite 6 → 7) still get a pull request each.
      tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # ---- Full Stack ----
  - package-ecosystem: npm
    directories:
      - "/Full Stack/node-postgres/api"
      - "/Full Stack/node-postgres/frontend"
      - "/Full Stack/dotnet-sqlserver/frontend"
      - "/Full Stack/go-php-mongo/web"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "full stack"
    groups:
      # React and its types are released together.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: nuget
    directory: "/Full Stack/dotnet-sqlserver"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "full stack"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: "/Full Stack/go-php-mongo/services/go"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "full stack"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: composer
    directory: "/Full Stack/go-php-mongo/services/catalog"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "full stack"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Base images in the Dockerfiles (node, nginx, the .NET SDK, golang, php...).
  - package-ecosystem: docker
    directories:
      - "/Full Stack/node-postgres/api"
      - "/Full Stack/node-postgres/frontend"
      - "/Full Stack/dotnet-sqlserver/api"
      - "/Full Stack/dotnet-sqlserver/frontend"
      - "/Full Stack/go-php-mongo/gateway"
      - "/Full Stack/go-php-mongo/services/go"
      - "/Full Stack/go-php-mongo/services/catalog"
    schedule:
      interval: monthly
    commit-message:
      prefix: "full stack"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
