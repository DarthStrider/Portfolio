version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "nuget"
    directory: "/api/RecipeApp.Api"
    schedule:
      interval: "daily"
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "daily"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "typescript"
        update-types: [version-update:semver-major]