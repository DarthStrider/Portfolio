# CI for vention/snack1-robot-arm: type-check, unit tests with coverage, production build,
# and an audit of the runtime dependencies. Runs on every push to any branch and on every
# pull request, whatever it changes, so the required checks on main always report.
name: snack1 robot arm

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: vention/snack1-robot-arm

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lowest version package.json's "engines" allows, and the current LTS.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: vention/snack1-robot-arm/package-lock.json

      # npm ci installs exactly what package-lock.json records, and fails if the lock file
      # and package.json disagree, instead of quietly resolving new versions.
      - run: npm ci

      - run: npm run typecheck

      - run: npm run test:coverage

      - name: Production build
        run: npx vite build

  audit:
    name: audit runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: vention/snack1-robot-arm/.nvmrc
      # Only what ships to the browser (three); dev tools never reach users.
      - run: npm audit --omit=dev --audit-level=high
