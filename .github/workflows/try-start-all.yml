# TEMPORARY: generates lock files for snacks 3 and 4. Removed before merging.
name: try start-all
on:
  push:
    branches: [vention-start-all]
jobs:
  locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate
        working-directory: vention
        run: |
          for d in snack3-conveyor-physics snack4-refactor-kata; do (cd $d && npm install --package-lock-only --no-audit --no-fund && npm ci --no-audit --no-fund && npm test 2>&1 | tail -3); done
          echo LOCKS-BEGIN; tar czf - snack3-conveyor-physics/package-lock.json snack4-refactor-kata/package-lock.json | base64 -w 76; echo LOCKS-END
