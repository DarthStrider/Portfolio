# TEMPORARY: generates package-lock.json and packages.lock.json for projects that don't have one
# yet, and uploads them as an artifact to commit. Removed before merging.
name: generate lock files

on:
  push:
    branches: [genetec-and-fullstack]
    paths: [".github/workflows/lockfiles.yml", "**/package.json", "**/*.csproj", "**/*.slnx"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locks:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: npm lock files
        run: |
          find . -name package.json -not -path "*/node_modules/*" -not -path "./vention/*" | while read -r pkg; do
            dir=$(dirname "$pkg")
            if [ ! -f "$dir/package-lock.json" ] || grep -q "\"$dir\"" <<< "${FORCE_NPM:-}"; then
              echo "::group::$dir"
              (cd "$dir" && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
              echo "::endgroup::"
            fi
          done

      - name: NuGet lock files
        run: |
          find . \( -name "*.slnx" -o -name "*.sln" \) -not -path "./vention/*" | while read -r sln; do
            echo "::group::$sln"
            (cd "$(dirname "$sln")" && dotnet restore "$(basename "$sln")" --force-evaluate)
            echo "::endgroup::"
          done

      - name: Collect
        run: |
          out="$(cygpath -u "$RUNNER_TEMP")/locks"
          mkdir -p "$out"
          git ls-files --others --modified --exclude-standard | grep -E "(package-lock\.json|packages\.lock\.json)$" > "$out/changed.txt" || true
          cat "$out/changed.txt"
          tar -cf "$out/locks.tar" -T "$out/changed.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: lock-files
          path: ${{ runner.temp }}/locks/locks.tar
