name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RecipeApp.slnx

      - name: Build
        run: dotnet build RecipeApp.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test RecipeApp.slnx --no-build --configuration Release

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build