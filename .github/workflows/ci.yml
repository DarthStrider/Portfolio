name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RecipeApp.slnx

      - name: Build
        run: dotnet build RecipeApp.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test RecipeApp.slnx --no-build --configuration Release