# TEMPORARY: screenshots of pick and place in a headless browser. Removed before merging.
name: visual check
on:
  push:
    branches: [snack1-pick-and-place]
jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Inventory API (in memory)
        working-directory: vention/snack5-inventory/api
        run: |
          npm ci
          DB=memory nohup npm start > /tmp/api.log 2>&1 &
          for i in $(seq 30); do curl -sf localhost:8080/api/info && break; sleep 1; done
      - name: Build and serve the arm
        working-directory: vention/snack1-robot-arm
        env:
          VITE_INVENTORY_API: http://localhost:8080
        run: |
          npm ci
          npx vite build
          nohup npx vite preview --port 4173 --strictPort > /tmp/web.log 2>&1 &
          for i in $(seq 30); do curl -sf localhost:4173/ > /dev/null && break; sleep 1; done
      - name: Drive it
        working-directory: .github/visual
        run: |
          npm init -y > /dev/null
          npm install playwright@1.56.1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          node pick.mjs
