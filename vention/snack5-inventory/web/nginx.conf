server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Forward API calls to the "api" service. Docker Compose and Kubernetes
  # both resolve that name to the API container(s) through their internal DNS.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri /index.html;
  }
}
