apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: inventory-api:1.0
          # Uses the image you built locally; Docker Desktop's cluster shares Docker's images.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # DB and its connection settings come from the overlay (k8s/postgres or k8s/mongo).
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-db-credentials
          startupProbe:
            httpGet: { path: /api/health/live, port: 8080 }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /api/health/live, port: 8080 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /api/health/ready, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
