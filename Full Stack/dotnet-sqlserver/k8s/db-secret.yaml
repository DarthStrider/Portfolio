# Demo credentials only. In a real cluster these would come from a secret
# manager (or be created with `kubectl create secret`), not live in git,
# and the app would use its own SQL login instead of sa.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  MSSQL_SA_PASSWORD: "Tasks-k8s-Passw0rd"
  ConnectionStrings__Default: "Server=sqlserver,1433;Database=TaskDb;User Id=sa;Password=Tasks-k8s-Passw0rd;TrustServerCertificate=True"
