apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: tasks-dotnet-api:1.0
          # Uses the image you built locally; Docker Desktop's cluster shares Docker's images.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ConnectionStrings__Default
              valueFrom: { secretKeyRef: { name: db-credentials, key: ConnectionStrings__Default } }
          # The API waits for the database before it starts listening. The startup probe
          # gives it up to 150s to do that before liveness checks take over.
          startupProbe:
            httpGet: { path: /api/health/live, port: 8080 }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /api/health/live, port: 8080 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /api/health/ready, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
