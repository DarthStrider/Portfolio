# Headless service gives the database a stable DNS name: "sqlserver".
apiVersion: v1
kind: Service
metadata:
  name: sqlserver
spec:
  clusterIP: None
  selector:
    app: sqlserver
  ports:
    - port: 1433
---
# StatefulSet + volumeClaimTemplate: the data survives pod restarts.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sqlserver
spec:
  serviceName: sqlserver
  replicas: 1
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
    spec:
      securityContext:
        # SQL Server runs as user 10001; this lets it write to the volume.
        fsGroup: 10001
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_SA_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: MSSQL_SA_PASSWORD } }
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            # SQL Server needs at least 2 GB of memory to start.
            requests: { cpu: 250m, memory: 2Gi }
            limits: { memory: 3Gi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
