# The gateway: the only thing the browser talks to. It serves the React build and routes
# /api/v1/* to whichever service owns that path. Services are resolved through Docker's
# DNS at request time (the variables below), so the gateway starts even if a service
# isn't up yet, and keeps working when one restarts with a new IP.

limit_req_zone $binary_remote_addr zone=signin:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    client_max_body_size 5m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth    http://auth:8080;
    set $order   http://order:8080;
    set $payment http://payment:8080;
    set $catalog http://catalog:8000;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Passed to every service so one request can be followed through all their logs.
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;

    # Slow down password guessing: 10 attempts a minute per IP, with a small burst.
    location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password)$ {
        limit_req zone=signin burst=5 nodelay;
        proxy_pass $auth;
    }

    # ---------- auth-service (Go) ----------
    location ~ ^/api/v1/(auth|me)(/|$)            { limit_req zone=api burst=60 nodelay; proxy_pass $auth; }
    location ~ ^/api/v1/admin/users(/|$)          { proxy_pass $auth; }

    # ---------- order-service (Go) ----------
    location ~ ^/api/v1/(cart|checkout|orders)(/|$) { limit_req zone=api burst=60 nodelay; proxy_pass $order; }
    location ~ ^/api/v1/admin/(orders|inventory|coupons|stats)(/|$) { proxy_pass $order; }

    # ---------- payment-service (Go) ----------
    location ~ ^/api/v1/payments(/|$)             { limit_req zone=api burst=60 nodelay; proxy_pass $payment; }
    location ~ ^/api/v1/admin/payments(/|$)       { proxy_pass $payment; }

    # ---------- catalog-service (PHP) ----------
    location ~ ^/api/v1/(catalog|content)(/|$)    { limit_req zone=api burst=100 nodelay; proxy_pass $catalog; }
    location ~ ^/api/v1/admin/(catalog|content)(/|$) { proxy_pass $catalog; }

    # Anything else under /api is unknown. Note /internal is never routed: payment-service
    # reaches order-service's /internal endpoints directly on the Docker network.
    location /api/ {
        default_type application/json;
        return 404 '{"error":{"code":"not_found","message":"no such endpoint"}}';
    }

    # ---------- the React app ----------
    root /usr/share/nginx/html;
    # (add_header in a location replaces the server-level ones, so they're repeated.)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location / {
        # Client-side routes (/shop, /orders/123) all load index.html.
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
